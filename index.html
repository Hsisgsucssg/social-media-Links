<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Enhanced SEO Meta Tags -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="apple-touch-icon" href="./assets/images/apple-touch-icon.png">

  <title>Jessica Randall - Frontend Developer | Digital Business Card</title>
  <meta name="description" content="Jessica Randall - Frontend developer and avid reader. Connect via GitHub, LinkedIn, Twitter, Instagram, and Frontend Mentor.">
  <meta name="keywords" content="frontend developer, web developer, javascript, react, UX design, London">
  <meta name="author" content="Jessica Randall">

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Jessica Randall - Frontend Developer">
  <meta property="og:description" content="Frontend developer and avid reader based in London, United Kingdom">
  <meta property="og:type" content="website">
  <meta property="og:url" content="">
  <meta property="og:image" content="./assets/images/avatar-jessica.jpeg">

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Jessica Randall - Frontend Developer">
  <meta name="twitter:description" content="Frontend developer and avid reader based in London, United Kingdom">
  <meta name="twitter:image" content="./assets/images/avatar-jessica.jpeg">

  <!-- Theme Color -->
  <meta name="theme-color" content="#151515">
  <meta name="msapplication-TileColor" content="#151515">

  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json">

  <!-- Preconnect to external domains -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="style.css">

  <!-- Attribution Style -->
  <style>
    .attribution {
      font-size: 11px; text-align: center;
      margin-top: 2rem;
      opacity: 0.7;
    }
    .attribution a {
       color: hsl(228, 45%, 44%);
      }

    /* Loading State */
    .app-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #151515;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    .loading-spinner {
      width: 2rem;
      height: 2rem;
      border: 2px solid #333;
      border-top: 2px solid hsl(75, 94%, 57%);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 1rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Fallback Styles */
    .no-js .card-actions {
      display: none;
    }

    .no-js .social-btn {
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .no-js .social-btn:hover {
      background-color: hsl(75, 94%, 57%);
    }
  </style>
</head>
<body>
  <!-- Loading State (shown while JavaScript loads) -->
  <div id="app-loading" class="app-loading">
    <div class="loading-spinner"></div>
    <div>Loading digital card...</div>
  </div>

  <!-- Main Profile Card (will be enhanced by JavaScript) -->
  <div class="card" id="profile-container" style="display: none;">
    <div class="info">
      <img src="./assets/images/avatar-jessica.jpeg" alt="Jessica Randall" loading="lazy">
      <h2>Jessica Randall</h2>
      <p>London, United Kingdom</p>
      <p id="p-1">"Front-end developer and avid reader."</p>
    </div>
    <div class="btn-s">
      <button id="btn-1" data-social-link="github" data-url="https://github.com/jessicarandall">GitHub</button>
      <button id="btn-2" data-social-link="frontend-mentor" data-url="https://www.frontendmentor.io/profile/jessicarandall">Frontend Mentor</button>
      <button id="btn-3" data-social-link="linkedin" data-url="https://linkedin.com/in/jessicarandall">LinkedIn</button>
      <button id="btn-4" data-social-link="twitter" data-url="https://twitter.com/jessicarandall">Twitter</button>
      <button id="btn-5" data-social-link="instagram" data-url="https://instagram.com/jessicarandall">Instagram</button>
    </div>
  </div>

  




  
  
  <!-- Attribution -->
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Enhanced by <a href="#" onclick="window.digitalCardApp?.showNotification('Next-generation digital card v2.0')">Digital Card Creator</a>.
  </div>

  <!-- JavaScript Module -->
  <script type="module" src="js/main.js"></script>

  <!-- Fallback for browsers without ES6 module support -->
  <script nomodule>
    console.warn('This browser does not support JavaScript modules. Some features may not work.');

    // Simple fallback functionality
    document.addEventListener('DOMContentLoaded', function() {
      // Hide loading state
      const loading = document.getElementById('app-loading');
      if (loading) loading.style.display = 'none';

      // Show card
      const card = document.getElementById('profile-container');
      if (card) card.style.display = 'block';

      // Add no-js class for styling
      document.body.classList.add('no-js');

      // Basic social link handling
      const socialLinks = document.querySelectorAll('[data-social-link]');
      socialLinks.forEach(link => {
        link.addEventListener('click', function() {
          const url = this.dataset.url;
          if (url && url !== '#') {
            window.open(url, '_blank');
          }
        });
      });
    });
  </script>

  <!-- Service Worker Registration for PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js')
          .then(function(registration) {
            console.log('SW registered: ', registration);
          })
          .catch(function(registrationError) {
            console.log('SW registration failed: ', registrationError);
          });
      });
    }
  </script>
</body>
</html>
