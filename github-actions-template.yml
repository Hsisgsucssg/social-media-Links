name: Automated Testing

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} with ${{ matrix.browser }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        browser: [chromium, firefox, webkit]
        include:
          - os: ubuntu-latest
            browser: chromium
          - os: ubuntu-latest
            browser: firefox
          - os: ubuntu-latest
            browser: webkit
          - os: windows-latest
            browser: chromium
          - os: macos-latest
            browser: webkit

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install ${{ matrix.browser }}

    - name: Install system dependencies for webkit
      if: matrix.browser == 'webkit' && matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.0-dev

    - name: Run visual regression tests
      run: npx playwright test tests/visual/ --project=${{ matrix.browser }}

    - name: Run accessibility tests
      run: npx playwright test tests/accessibility/ --project=${{ matrix.browser }}

    - name: Run HTML validation tests
      run: npx playwright test tests/validation/ --project=${{ matrix.browser }}

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.browser }}
        path: |
          test-results/
          playwright-report/
          visual-baseline/

  performance:
    name: Performance Testing
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install chromium

    - name: Install system dependencies for Lighthouse
      run: |
        sudo apt-get update
        sudo apt-get install -y gconf-service libasound2 libatk1.0-0 libc6 libcairo-gobject2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgcc1 libgconf-2-4 libgdk-pixbuf2.0-0 libglib2.0-0 libgtk-3-0 libnspr4 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 ca-certificates fonts-liberation libappindicator1 libnss3 lsb-release xdg-utils wget

    - name: Run performance tests
      run: npx playwright test tests/performance/

    - name: Upload performance results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-results
        path: |
          test-results/
          playwright-report/

  cross-browser:
    name: Cross-Browser Visual Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install

    - name: Run cross-browser visual tests
      run: npx playwright test tests/visual/social-profile.spec.ts --grep="Cross-browser"

    - name: Upload cross-browser results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cross-browser-results
        path: |
          test-results/
          playwright-report/

  accessibility-report:
    name: Accessibility Report
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install chromium

    - name: Run comprehensive accessibility tests
      run: npx playwright test tests/accessibility/ --reporter=json

    - name: Generate accessibility report
      run: |
        echo "# Accessibility Compliance Report" > accessibility-report.md
        echo "Generated on: $(date)" >> accessibility-report.md
        echo "" >> accessibility-report.md
        echo "## Results" >> accessibility-report.md
        if [ -f test-results/results.json ]; then
          jq -r '.suites[].specs[].tests[].results[] | "- \(.title): \(.status)"' test-results/results.json >> accessibility-report.md
        fi

    - name: Upload accessibility report
      uses: actions/upload-artifact@v4
      with:
        name: accessibility-report
        path: |
          accessibility-report.md
          test-results/

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run security audit
      run: npm audit --audit-level=moderate

  comment-pr:
    name: Comment on Pull Request
    runs-on: ubuntu-latest
    needs: [test, performance, accessibility-report]
    if: github.event_name == 'pull_request'

    steps:
    - name: Download test results
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: Generate PR comment
      run: |
        echo "# 🧪 Test Results" > pr-comment.md
        echo "" >> pr-comment.md
        echo "## ✅ Automated Tests Complete" >> pr-comment.md
        echo "" >> pr-comment.md
        echo "### Test Categories:" >> pr-comment.md
        echo "- ✅ Visual Regression Tests" >> pr-comment.md
        echo "- ✅ Accessibility Compliance Tests" >> pr-comment.md
        echo "- ✅ HTML Validation Tests" >> pr-comment.md
        echo "- ✅ Performance Tests" >> pr-comment.md
        echo "- ✅ Security Audit" >> pr-comment.md
        echo "" >> pr-comment.md
        echo "### Browsers Tested:" >> pr-comment.md
        echo "- Chromium (Ubuntu, Windows, macOS)" >> pr-comment.md
        echo "- Firefox (Ubuntu)" >> pr-comment.md
        echo "- WebKit (Ubuntu, macOS)" >> pr-comment.md
        echo "" >> pr-comment.md
        echo "### Viewports Tested:" >> pr-comment.md
        echo "- Mobile (375px × 667px)" >> pr-comment.md
        echo "- Tablet (768px × 1024px)" >> pr-comment.md
        echo "- Desktop (1440px × 900px)" >> pr-comment.md
        echo "" >> pr-comment.md
        echo "📊 [View detailed test report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> pr-comment.md

    - name: Comment PR
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const comment = fs.readFileSync('pr-comment.md', 'utf8');
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });